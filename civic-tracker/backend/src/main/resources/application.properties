server.port=8080
server.error.include-message=always

# --- MySQL ---------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/civic_tracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# --- JPA -----------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

# Allowed frontend origin (Vite dev server by default)
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}